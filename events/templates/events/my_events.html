{% extends 'base.html' %}

{% block content %}
<div class="container my-4">
  <form method="get" class="row g-3 align-items-center mb-4">
    <div class="col-auto">
      <label for="filter" class="col-form-label">Filtrează evenimente:</label>
    </div>
    <div class="col-auto">
      <select name="filter" id="filter" class="form-select" onchange="this.form.submit()">
        <option value="all" {% if filter_option == 'all' %}selected{% endif %}>Toate</option>
        <option value="future" {% if filter_option == 'future' %}selected{% endif %}>Viitoare</option>
        <option value="past" {% if filter_option == 'past' %}selected{% endif %}>Trecute</option>
      </select>
    </div>
    <noscript>
      <div class="col-auto">
        <button type="submit" class="btn btn-primary">Aplică</button>
      </div>
    </noscript>
  </form>

  <h2 class="mb-4">{{ title }}</h2>

  {% if events %}
    <div class="list-group mb-3">
      {% for event in events %}
        <a href="{% url 'events:event_detail' event.id %}" class="list-group-item list-group-item-action">
          <strong>{{ event.title }}</strong>
          <span class="text-muted"> – {{ event.start_date|date:"d.m.Y" }}</span>
        </a>
      {% endfor %}
    </div>
  {% else %}
    <div class="alert alert-warning">Nu există evenimente afișabile.</div>
  {% endif %}

  <a href="{% url 'events:event_list' %}" class="btn btn-secondary">← Înapoi la listă</a>
</div>
{% endblock %}
